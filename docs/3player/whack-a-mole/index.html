<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <meta name="description" content="Three-player Whack-a-Mole on one device. Tap your moles and get the highest score in 40 seconds.">
  <title>Whack-a-Mole · 3 Player · Mini Games</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="40" height="40">
        <div>
          <h1>Whack-a-Mole</h1>
          <p>3 players · one device</p>
        </div>
      </div>
      <button class="icon-btn" id="restart" aria-label="Restart the game">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="timerbar" aria-label="Time remaining">
      <div class="timerbar-track"><i id="progress"></i></div>
      <span id="time">40s</span>
    </div>

    <div class="arena-wrap">
      <div class="arena" id="arena"></div>

      <div class="countdown" id="countdown">
        <div>
          <strong id="countdown-number">3</strong>
          <span id="countdown-copy">players · 40 seconds</span>
          <button class="btn btn--primary countdown-btn" id="start">Start round</button>
        </div>
      </div>
    </div>

    <p class="hint">Tap the moles in your lane. Every mole is +1 point.</p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <div class="veil" id="veil" hidden>
    <div class="veil-card">
      <img src="assets/trophy.svg" alt="" width="76" height="76">
      <p class="eyebrow">40 second round</p>
      <h2 id="veil-title">Player 1 wins!</h2>
      <p id="veil-copy">Great whacking.</p>
      <ol class="podium" id="podium"></ol>
      <div class="veil-actions">
        <button class="btn btn--primary" id="play-again">Play again</button>
        <a class="btn btn--ghost" href="../../index.html">All games</a>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../../sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
