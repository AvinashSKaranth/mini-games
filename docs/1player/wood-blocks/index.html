<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <meta name="description" content="Play Wood Blocks offline. Place wooden pieces on a 9x9 board, clear full rows, columns, and squares, and chase the high score.">
  <title>Wood Blocks · Mini Games</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="40" height="40">
        <div>
          <h1>Wood Blocks</h1>
          <p>1 player · block puzzle</p>
        </div>
      </div>
      <button class="icon-btn" id="new-game-top" type="button" aria-label="Start a new game">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section class="meta" aria-label="Score summary">
      <div><span>Score</span><strong id="score">0</strong></div>
      <div><span>Best</span><strong id="best">—</strong></div>
      <div><span>Lines</span><strong id="lines">0</strong></div>
    </section>

    <div class="play" id="play">
      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="Wood block board, 9 by 9"></div>
      </div>
      <div class="tray" id="tray" role="group" aria-label="Piece tray"></div>
    </div>

    <div class="tools">
      <button class="btn" id="deselect" type="button" disabled>Deselect</button>
      <button class="btn btn--primary" id="new-game" type="button">New game</button>
    </div>

    <p class="hint">Drag a piece onto the board, or tap it and then tap a square. Fill a row, column, or 3×3 square to clear it.</p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <div class="veil" id="veil" hidden>
    <div class="veil-card" role="dialog" aria-modal="true" aria-labelledby="veil-title">
      <img src="assets/icon.svg" alt="" width="64" height="64">
      <p class="eyebrow" id="veil-eyebrow">No room left</p>
      <h2 id="veil-title">Board jammed</h2>
      <p id="veil-copy">No piece fits anywhere.</p>
      <dl class="result" id="veil-stats"></dl>
      <div class="veil-actions">
        <button class="btn btn--primary" id="veil-primary" type="button">New game</button>
        <a class="btn btn--ghost" href="../../index.html">All games</a>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../../sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
