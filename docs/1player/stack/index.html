<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <meta name="description" content="Play Stack offline. Time the moving block, land it flush, and build the tallest tower you can.">
  <title>Stack · Mini Games</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="40" height="40">
        <div>
          <h1>Stack</h1>
          <p>1 player · timing tower</p>
        </div>
      </div>
      <button class="icon-btn" id="reset" type="button" aria-label="Start a new tower">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section class="meta" aria-label="Tower stats">
      <div><span>Height</span><strong id="height">0</strong></div>
      <div><span>Best</span><strong id="best">—</strong></div>
      <div><span>Perfect</span><strong id="perfect">0</strong></div>
    </section>

    <div class="stage-wrap" id="stage-wrap">
      <canvas id="stage" width="600" height="800" role="img" aria-label="A tower with a block sliding across the top."></canvas>
      <div class="toast" id="toast" aria-hidden="true"></div>
    </div>

    <p class="hint">Tap the screen, or press space, to drop the block. Land it flush for a perfect stack.</p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <div class="veil" id="veil" hidden>
    <div class="veil-card" role="dialog" aria-modal="true" aria-labelledby="veil-title">
      <img src="assets/icon.svg" alt="" width="64" height="64">
      <p class="eyebrow" id="veil-eyebrow">Tower toppling</p>
      <h2 id="veil-title">Off the edge</h2>
      <p id="veil-copy">You stacked 0 blocks.</p>
      <dl class="result" id="veil-stats"></dl>
      <div class="veil-actions">
        <button class="btn btn--primary" id="veil-primary" type="button">Build again</button>
        <a class="btn btn--ghost" href="../../index.html">All games</a>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../../sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
