<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <meta name="description" content="Play Ball Run offline. Steer a rolling ball down a three-lane track, dodge the gaps, and grab every gem you can.">
  <title>Ball Run · Mini Games</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="40" height="40">
        <div>
          <h1>Ball Run</h1>
          <p>1 player · endless runner</p>
        </div>
      </div>
      <button class="icon-btn" id="reset" type="button" aria-label="Start a new run">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section class="meta" aria-label="Run stats">
      <div><span>Score</span><strong id="score">0</strong></div>
      <div><span>Best</span><strong id="best">—</strong></div>
      <div><span>Gems</span><strong id="gems">0</strong></div>
    </section>

    <div class="stage-wrap" id="stage-wrap" tabindex="-1">
      <canvas id="stage" width="600" height="800" role="img" aria-label="A ball rolling down a three-lane track between gaps and gems."></canvas>
      <div class="ready" id="ready" aria-hidden="true">
        <strong>Tap to roll</strong>
        <span>Arrows or A / D</span>
      </div>
    </div>

    <div class="lane-controls">
      <button class="lane-btn" id="go-left" type="button" aria-label="Move one lane left">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="lane-btn" id="go-right" type="button" aria-label="Move one lane right">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <p class="hint">Switch lanes with the buttons, the arrow keys, or by tapping either half of the track.</p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <div class="veil" id="veil" hidden>
    <div class="veil-card" role="dialog" aria-modal="true" aria-labelledby="veil-title">
      <img src="assets/icon.svg" alt="" width="64" height="64">
      <p class="eyebrow" id="veil-eyebrow">Run over</p>
      <h2 id="veil-title">Down the hole</h2>
      <p id="veil-copy">You scored 0.</p>
      <dl class="result" id="veil-stats"></dl>
      <div class="veil-actions">
        <button class="btn btn--primary" id="veil-primary" type="button">Run again</button>
        <a class="btn btn--ghost" href="../../index.html">All games</a>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../../sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
