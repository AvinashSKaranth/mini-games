<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333B52"/>
      <stop offset="1" stop-color="#242B3D"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FF9A8C"/>
      <stop offset="0.55" stop-color="#FF6B5A"/>
      <stop offset="1" stop-color="#D8432F"/>
    </radialGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD75E"/>
      <stop offset="1" stop-color="#FFB703"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="104" height="104" rx="26" fill="url(#road)"/>

  <!-- lane rails -->
  <g stroke="#FFFDF8" stroke-opacity=".35" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 11">
    <path d="M42 10v92"/>
    <path d="M70 10v92"/>
  </g>
  <g stroke="#FFB703" stroke-width="4" stroke-linecap="round">
    <path d="M14 14v84"/>
    <path d="M98 14v84"/>
  </g>

  <!-- gap hole -->
  <rect x="17" y="26" width="22" height="26" rx="8" fill="#151A26"/>
  <rect x="19" y="28" width="18" height="22" rx="6" fill="#0C0F17"/>

  <!-- gem -->
  <g transform="translate(84 34)">
    <path d="M0 -11 9 0 0 11 -9 0z" fill="url(#gem)" stroke="#1E2433" stroke-opacity=".35" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-4 -2 0 -7 4 -2" fill="none" stroke="#FFFDF8" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ball -->
  <g>
    <ellipse cx="56" cy="84" rx="20" ry="6" fill="#000" fill-opacity=".35"/>
    <circle cx="56" cy="66" r="20" fill="url(#ball)" stroke="#1E2433" stroke-opacity=".3" stroke-width="2.5"/>
    <path d="M46 60c4-5 11-7 17-5" fill="none" stroke="#FFFDF8" stroke-opacity=".75" stroke-width="3" stroke-linecap="round"/>
    <circle cx="63" cy="72" r="4" fill="#FFFDF8" fill-opacity=".5"/>
  </g>
</svg>
