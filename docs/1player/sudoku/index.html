<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <meta name="description" content="Play Sudoku offline with notes, hints, and three difficulty levels.">
  <title>Sudoku · Mini Games</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="40" height="40">
        <div>
          <h1>Sudoku</h1>
          <p>1 player · logic</p>
        </div>
      </div>
      <button class="icon-btn" id="new-game" aria-label="New puzzle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="play-panel play-panel--top">
      <div class="difficulty" role="group" aria-label="Difficulty">
        <button data-level="easy" class="is-active">Easy</button>
        <button data-level="medium">Medium</button>
        <button data-level="hard">Hard</button>
      </div>

      <section class="meta" aria-label="Puzzle status">
        <div><span>Mistakes</span><strong id="mistakes">0</strong></div>
        <div><span>Time</span><strong id="timer">00:00</strong></div>
        <div><span>Clues</span><strong id="clues">44</strong></div>
      </section>
    </div>

    <div class="board-wrap">
      <div class="sudoku" id="board" role="grid" aria-label="Sudoku board"></div>
      <div class="veil" id="veil" hidden>
        <div class="veil-card">
          <img src="assets/sparkle.svg" alt="" width="76" height="76">
          <p class="eyebrow">Puzzle complete</p>
          <h2 id="veil-title">Nicely done!</h2>
          <p id="veil-copy">You solved the puzzle.</p>
          <dl class="result" id="veil-stats"></dl>
          <div class="veil-actions">
            <button class="btn btn--primary" id="veil-primary">New puzzle</button>
            <button class="btn btn--ghost" id="veil-secondary" hidden>Close</button>
          </div>
        </div>
      </div>
    </div>

    <div class="play-panel play-panel--bottom">
      <div class="keypad" id="keypad" aria-label="Number pad">
        <button data-num="1">1</button>
        <button data-num="2">2</button>
        <button data-num="3">3</button>
        <button data-num="4">4</button>
        <button data-num="5">5</button>
        <button data-num="6">6</button>
        <button data-num="7">7</button>
        <button data-num="8">8</button>
        <button data-num="9">9</button>
        <button data-num="0" class="key-erase" aria-label="Erase cell">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l6-6 9 9-4 4H8l-4-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 17l7-7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>

      <div class="tools">
        <button class="tool" id="notes" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1L19 8a2.8 2.8 0 0 0-4-4L4 15l-1 5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13 6l5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span>Notes</span>
        </button>
        <button class="tool" id="hint">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V17h5.2v-1.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Hint</span>
        </button>
        <button class="tool" id="erase">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Clear</span>
        </button>
      </div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../../sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
