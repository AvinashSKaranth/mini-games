    <rect x="66" y="70" width="32" height="12" rx="5" fill="#17A294"/>
  </g>

  <!-- bird -->
  <g transform="rotate(-12 40 54)">
    <circle cx="40" cy="54" r="20" fill="url(#bird)" stroke="#1E2433" stroke-opacity=".25" stroke-width="2.5"/>
    <path d="M30 58c6 6 16 6 22 0" fill="none" stroke="#FFFDF8" stroke-opacity=".8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="47" cy="47" r="7" fill="#FFFDF8"/>
