  <path d="M14 40c4-4 9-4 13 0" fill="none" stroke="#1E2433" stroke-opacity=".2" stroke-width="3" stroke-linecap="round"/>
  <path d="M18 88h18" stroke="#78B841" stroke-width="5" stroke-linecap="round"/>
