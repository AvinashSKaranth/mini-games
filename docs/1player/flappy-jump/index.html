<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <meta name="description" content="Play Flappy Jump offline. Tap to flap through the gaps, dodge the pipes, and set the longest flight you can.">
  <title>Flappy Jump · Mini Games</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="40" height="40">
        <div>
          <h1>Flappy Jump</h1>
          <p>1 player · one-tap flight</p>
        </div>
      </div>
      <button class="icon-btn" id="reset" type="button" aria-label="Start a new flight">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section class="meta" aria-label="Flight stats">
      <div><span>Score</span><strong id="score">0</strong></div>
      <div><span>Best</span><strong id="best">—</strong></div>
      <div><span>Speed</span><strong id="speed">0</strong></div>
    </section>

    <div class="stage-wrap" id="stage-wrap" tabindex="-1">
      <canvas id="stage" width="600" height="800" role="img" aria-label="A small bird flying between tall pipes."></canvas>
      <div class="ready" id="ready" aria-hidden="true">
        <strong>Tap to fly</strong>
        <span>Space works too</span>
      </div>
    </div>

    <p class="hint">Every tap gives a flap. The pipes speed up the further you fly.</p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <div class="veil" id="veil" hidden>
    <div class="veil-card" role="dialog" aria-modal="true" aria-labelledby="veil-title">
      <img src="assets/icon.svg" alt="" width="64" height="64">
      <p class="eyebrow" id="veil-eyebrow">Flight over</p>
      <h2 id="veil-title">Feathers down</h2>
      <p id="veil-copy">You flew 0.</p>
      <dl class="result" id="veil-stats"></dl>
      <div class="veil-actions">
        <button class="btn btn--primary" id="veil-primary" type="button">Fly again</button>
        <a class="btn btn--ghost" href="../../index.html">All games</a>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../../sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
