<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <meta name="description" content="Play Hangman offline. Guess a hidden word from its category one letter at a time, with six misses allowed.">
  <title>Hangman · Mini Games</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="40" height="40">
        <div>
          <h1>Hangman</h1>
          <p>1 player · word puzzle</p>
        </div>
      </div>
      <button class="icon-btn" id="new-game" type="button" aria-label="New word">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section class="stats" aria-label="Your record">
      <div><span>Played</span><strong id="stat-played">0</strong></div>
      <div><span>Wins</span><strong id="stat-wins">0</strong></div>
      <div><span>Streak</span><strong id="stat-streak">0</strong></div>
      <div><span>Best</span><strong id="stat-best">0</strong></div>
    </section>

    <div class="play" id="play" tabindex="-1">
      <div class="drawing">
        <svg id="gallows" viewBox="0 0 200 160" role="img" aria-label="Empty gallows, no parts drawn">
          <g class="gallow-lines">
            <path d="M22 148h74"/>
            <path d="M48 149V20"/>
            <path d="M44 20h78"/>
            <path d="M48 44 68 20"/>
            <path d="M120 20v16"/>
          </g>
          <g id="figure">
            <circle class="part" data-part="0" cx="120" cy="47" r="11"/>
            <path class="part" data-part="1" d="M120 58v34"/>
            <path class="part" data-part="2" d="M120 66 105 80"/>
            <path class="part" data-part="3" d="M120 66 135 80"/>
            <path class="part" data-part="4" d="M120 92 108 111"/>
            <path class="part" data-part="5" d="M120 92 132 111"/>
          </g>
        </svg>
        <p class="category" id="category">Animals · 7 letters</p>
      </div>

      <ol class="word" id="word" aria-label="Word to guess"></ol>

      <div class="keyboard" id="keyboard" role="group" aria-label="Letter keyboard"></div>
    </div>

    <p class="hint">Guess the word one letter at a time. Six misses and the rope is out.</p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <div class="veil" id="veil" hidden>
    <div class="veil-card" role="dialog" aria-modal="true" aria-labelledby="veil-title">
      <img src="assets/icon.svg" alt="" width="64" height="64">
      <p class="eyebrow" id="veil-eyebrow">Word found</p>
      <h2 id="veil-title">Nice one!</h2>
      <p id="veil-copy">The word was OCTOPUS.</p>
      <dl class="result" id="veil-stats"></dl>
      <div class="veil-actions">
        <button class="btn btn--primary" id="veil-primary" type="button">New word</button>
        <a class="btn btn--ghost" href="../../index.html">All games</a>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../../sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
