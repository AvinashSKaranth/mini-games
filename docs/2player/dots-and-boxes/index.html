<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <meta name="description" content="Play Dots and Boxes offline. Draw lines between dots, close boxes to score, and chain extra turns against a rival or the computer.">
  <title>Dots and Boxes · 2 Player · Mini Games</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="40" height="40">
        <div>
          <h1>Dots and Boxes</h1>
          <p>2 players · strategy</p>
        </div>
      </div>
      <button class="icon-btn" id="reset" type="button" aria-label="Restart the match">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="difficulty" role="group" aria-label="Board size">
      <button type="button" data-size="3" class="is-active" aria-pressed="true">3×3</button>
      <button type="button" data-size="4" aria-pressed="false">4×4</button>
      <button type="button" data-size="5" aria-pressed="false">5×5</button>
    </div>

    <div class="mode-switch" role="group" aria-label="Opponent">
      <button type="button" data-mode="2p" class="is-on" aria-pressed="true">2 Players</button>
      <button type="button" data-mode="ai" aria-pressed="false">vs AI</button>
    </div>

    <section class="scoreboard" aria-label="Score">
      <div class="player-card player-card--p1 is-active" id="card-0">
        <span class="pc-name"><i class="dot"></i><span id="name-0">Player 1</span></span>
        <b class="pc-score" id="score-0">0</b>
      </div>
      <div class="turn-pill" id="turn-pill">Player 1 draws</div>
      <div class="player-card player-card--p2" id="card-1">
        <span class="pc-name"><i class="dot"></i><span id="name-1">Player 2</span></span>
        <b class="pc-score" id="score-1">0</b>
      </div>
    </section>

    <div class="board-wrap" id="board-wrap">
      <div class="grid" id="grid" role="group" aria-label="Dots and boxes board"></div>
    </div>

    <p class="hint">Draw a line; close a box and you score it — then draw again. Most boxes when the board fills wins.</p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <div class="veil" id="veil" hidden>
    <div class="veil-card" role="dialog" aria-modal="true" aria-labelledby="veil-title">
      <img src="assets/icon.svg" alt="" width="64" height="64">
      <p class="eyebrow" id="veil-eyebrow">Board complete</p>
      <h2 id="veil-title">Player 1 wins!</h2>
      <p id="veil-copy">Nine boxes to seven.</p>
      <dl class="result" id="veil-stats"></dl>
      <div class="veil-actions">
        <button class="btn btn--primary" id="rematch" type="button">Play again</button>
        <a class="btn btn--ghost" href="../../index.html">All games</a>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../../sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
