<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <meta name="description" content="Play two-player Memory Match on one device. Flip cards, find all eight pairs, and take turns hunting for the most matches.">
  <title>Memory Match · 2 Player · Mini Games</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="40" height="40">
        <div>
          <h1>Memory Match</h1>
          <p>2 players · one device</p>
        </div>
      </div>
      <button class="icon-btn" id="reset" aria-label="Start a new match">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="play" id="play">
      <section class="players" aria-label="Scoreboard">
        <div class="player player--p1 is-active" id="player-1">
          <span class="chip" aria-hidden="true"><img src="assets/star.svg" alt="" width="24" height="24"></span>
          <span class="who"><strong>Player 1</strong><small>pairs</small></span>
          <b class="pairs" id="score-1">0</b>
        </div>
        <div class="player player--p2" id="player-2">
          <span class="chip" aria-hidden="true"><img src="assets/moon.svg" alt="" width="24" height="24"></span>
          <span class="who"><strong>Player 2</strong><small>pairs</small></span>
          <b class="pairs" id="score-2">0</b>
        </div>
      </section>

      <div class="turnbar" id="turnbar">
        <span class="turn-dot" aria-hidden="true"></span>
        <strong id="turn-text">Player 1's turn</strong>
        <span class="turn-chip">Tap two cards</span>
      </div>

      <div class="board-shell">
        <div class="board" id="board" role="group" aria-label="Memory match board, 4 by 4 cards"></div>
      </div>

      <div class="actions">
        <button class="btn btn--ghost" id="new-match">New match</button>
        <p class="hint">Flip two cards. A pair scores and keeps your turn; a miss passes it. Most pairs wins.</p>
      </div>
    </div>

    <div class="veil" id="veil" hidden>
      <div class="veil-card" role="dialog" aria-modal="true" aria-labelledby="veil-title" aria-describedby="veil-copy">
        <img src="assets/trophy.svg" alt="" width="76" height="76">
        <p class="eyebrow" id="veil-eyebrow">Match complete</p>
        <h2 id="veil-title">Player 1 wins!</h2>
        <p class="veil-score" id="veil-score">5 – 3</p>
        <p id="veil-copy">All eight pairs found.</p>
        <div class="veil-actions">
          <button class="btn btn--primary" id="veil-rematch">Rematch</button>
        </div>
      </div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../../sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
