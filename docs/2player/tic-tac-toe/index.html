<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <meta name="description" content="Play two-player Tic Tac Toe on one device. First to five round wins takes the match.">
  <title>Tic Tac Toe · 2 Player · Mini Games</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="40" height="40">
        <div>
          <h1>Tic Tac Toe</h1>
          <p>2 players · one device</p>
        </div>
      </div>
      <button class="icon-btn" id="reset" aria-label="Reset the match">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="side-panel side-panel--top">
      <div class="matchbar">
        <span id="round-label">Round 1</span>
        <span class="target">First to 5 wins</span>
      </div>

      <div class="mode-switch" role="group" aria-label="Opponent">
        <button type="button" data-mode="2p" class="is-on">2 Players</button>
        <button type="button" data-mode="easy">Easy AI</button>
        <button type="button" data-mode="hard">Sharp AI</button>
      </div>

      <section class="players" aria-label="Scoreboard">
        <div class="player player--x is-active" id="player-x">
          <span class="chip"><img src="assets/x.svg" alt="" width="28" height="28"></span>
          <span class="who"><strong>Player 1</strong><small>Playing X</small></span>
          <b class="wins" id="score-x">0</b>
        </div>
        <div class="player player--o" id="player-o">
          <span class="chip"><img src="assets/o.svg" alt="" width="28" height="28"></span>
          <span class="who"><strong>Player 2</strong><small>Playing O</small></span>
          <b class="wins" id="score-o">0</b>
        </div>
      </section>

      <div class="turnbar" id="turnbar">
        <span class="turn-dot" id="turn-dot"></span>
        <strong id="turn-text">Player 1's turn</strong>
        <img id="turn-mark" src="assets/x.svg" alt="" width="20" height="20">
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Tic Tac Toe board">
        <svg class="winline" viewBox="0 0 300 300" aria-hidden="true">
          <line id="win-line" x1="20" y1="50" x2="280" y2="50"></line>
        </svg>
      </div>
    </div>

    <div class="side-panel side-panel--bottom">
      <div class="resultbar" id="resultbar" hidden>
        <span id="result-text">Player 1 wins the round</span>
        <button class="btn btn--primary" id="next-round">Next round</button>
      </div>

      <div class="actions">
        <button class="btn btn--ghost" id="reset-match">Reset match</button>
        <p class="hint">Take turns tapping a square. Winner starts the next round.</p>
      </div>
    </div>

    <div class="veil" id="veil" hidden>
      <div class="veil-card">
        <img src="assets/trophy.svg" alt="" width="76" height="76">
        <p class="eyebrow">Match complete</p>
        <h2 id="veil-title">Player 1 wins!</h2>
        <p id="veil-copy">A clean sweep.</p>
        <div class="veil-actions">
          <button class="btn btn--primary" id="veil-primary">New match</button>
        </div>
      </div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../../sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
