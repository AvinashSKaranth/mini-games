<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <meta name="description" content="Play Mancala on one device. Sow stones, capture the other side, and fill your store.">
  <title>Mancala · 2 Player · Mini Games</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="40" height="40">
        <div><h1>Mancala</h1><p>2 players · sow &amp; capture</p></div>
      </div>
      <button class="icon-btn" id="reset" type="button" aria-label="Start a new game">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="turnbar" id="turnbar">
      <span class="dot"></span>
      <strong id="turn-text">Player 1's turn</strong>
      <span id="hint-turn">Pick one of your pits</span>
    </div>

    <div class="board-wrap" id="board-wrap">
      <div class="board" id="board" role="group" aria-label="Mancala board">
        <div class="store store--p2" id="store-2"><span>Player 2</span><b id="store-count-2">0</b></div>
        <div class="pit-row pit-row--top" id="row-top"></div>
        <div class="store store--p1" id="store-1"><span>Player 1</span><b id="store-count-1">0</b></div>
        <div class="pit-row pit-row--bottom" id="row-bottom"></div>
      </div>
      <p class="hint">Drop your last stone in your store for another turn. Land in an empty pit to capture the opposite stones.</p>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <div class="veil" id="veil" hidden>
    <div class="veil-card" role="dialog" aria-modal="true" aria-labelledby="veil-title">
      <img src="assets/icon.svg" alt="" width="64" height="64">
      <p class="eyebrow">Game complete</p>
      <h2 id="veil-title">Player 1 wins!</h2>
      <p id="veil-copy">24 to 24.</p>
      <div class="veil-actions">
        <button class="btn btn--primary" id="rematch" type="button">Play again</button>
        <a class="btn btn--ghost" href="../../index.html">All games</a>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('../../sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
