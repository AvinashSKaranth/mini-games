  <rect x="4" y="4" width="104" height="104" rx="26" fill="#232B3D"/>

  <circle cx="56" cy="56" r="42" fill="url(#dohyo)" stroke="#1E2433" stroke-opacity=".5" stroke-width="4"/>
  <circle cx="56" cy="56" r="33" fill="none" stroke="#1E2433" stroke-opacity=".16" stroke-width="2.4"/>

  <!-- wrestler left (pushing right) -->
