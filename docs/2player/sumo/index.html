<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <meta name="description" content="Play Sumo offline. Two wrestlers push and dash in a ring on one device — force your rival out first to two bouts.">
  <title>Sumo · 2 Player · Mini Games</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="40" height="40">
        <div>
          <h1>Sumo</h1>
          <p>2 players · push duel</p>
        </div>
      </div>
      <button class="icon-btn" id="reset" type="button" aria-label="Restart the match">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="mode-switch" role="group" aria-label="Opponent">
      <button type="button" data-mode="2p" class="is-on" aria-pressed="true">2 Players</button>
      <button type="button" data-mode="ai" aria-pressed="false">vs AI</button>
    </div>

    <section class="scoreboard" aria-label="Score">
      <div class="fighter fighter--p1 is-active" id="card-0">
        <span class="fighter-name"><i class="dot"></i><span id="name-0">Player 1</span></span>
        <b class="fighter-score" id="score-0">0</b>
        <span class="pips" id="pips-0" aria-hidden="true"><i></i><i></i></span>
      </div>
      <div class="bout" id="bout">Bout 1</div>
      <div class="fighter fighter--p2" id="card-1">
        <span class="fighter-name"><i class="dot"></i><span id="name-1">Player 2</span></span>
        <b class="fighter-score" id="score-1">0</b>
        <span class="pips" id="pips-1" aria-hidden="true"><i></i><i></i></span>
      </div>
    </section>

    <div class="stage-wrap" id="stage-wrap" tabindex="-1">
      <canvas id="stage" width="900" height="560" role="img" aria-label="A sumo ring with two wrestlers pushing each other."></canvas>
      <div class="countdown" id="countdown" aria-hidden="true"><span id="count-num">READY</span></div>
    </div>

    <div class="controls">
      <div class="pad" id="pad-0" aria-label="Player 1 controls">
        <button class="pad-btn pad-up" type="button" data-p="0" data-dir="up" aria-label="Player 1 push up"><span>W</span></button>
        <button class="pad-btn pad-left" type="button" data-p="0" data-dir="left" aria-label="Player 1 push left"><span>A</span></button>
        <button class="pad-dash" type="button" data-p="0" aria-label="Player 1 dash, key E"><span>DASH</span><small>E</small></button>
        <button class="pad-btn pad-right" type="button" data-p="0" data-dir="right" aria-label="Player 1 push right"><span>D</span></button>
        <button class="pad-btn pad-down" type="button" data-p="0" data-dir="down" aria-label="Player 1 push down"><span>S</span></button>
      </div>

      <div class="pad" id="pad-1" aria-label="Player 2 controls">
        <button class="pad-btn pad-up" type="button" data-p="1" data-dir="up" aria-label="Player 2 push up"><span>↑</span></button>
        <button class="pad-btn pad-left" type="button" data-p="1" data-dir="left" aria-label="Player 2 push left"><span>←</span></button>
        <button class="pad-dash" type="button" data-p="1" aria-label="Player 2 dash, key slash"><span>DASH</span><small>/</small></button>
        <button class="pad-btn pad-right" type="button" data-p="1" data-dir="right" aria-label="Player 2 push right"><span>→</span></button>
        <button class="pad-btn pad-down" type="button" data-p="1" data-dir="down" aria-label="Player 2 push down"><span>↓</span></button>
      </div>
    </div>

    <p class="hint">Shove your rival across the ring edge. First to two bouts wins the match.</p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <div class="veil" id="veil" hidden>
    <div class="veil-card" role="dialog" aria-modal="true" aria-labelledby="veil-title">
      <img src="assets/icon.svg" alt="" width="64" height="64">
      <p class="eyebrow" id="veil-eyebrow">Match complete</p>
      <h2 id="veil-title">Player 1 wins!</h2>
      <p id="veil-copy">Two bouts to none.</p>
      <dl class="result" id="veil-stats"></dl>
      <div class="veil-actions">
        <button class="btn btn--primary" id="rematch" type="button">Rematch</button>
        <a class="btn btn--ghost" href="../../index.html">All games</a>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../../sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
