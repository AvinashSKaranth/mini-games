<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <meta name="description" content="Play Checkers on one device. Jump, crown your kings, and clear the board in local two-player or against the computer.">
  <title>Checkers · Mini Games</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="40" height="40">
        <div><h1>Checkers</h1><p>2 players · capture &amp; crown</p></div>
      </div>
      <button class="icon-btn" id="reset" type="button" aria-label="Start a new game">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="difficulty" role="group" aria-label="Opponent">
      <button type="button" data-mode="2p" class="is-active">2 Players</button>
      <button type="button" data-mode="ai">vs AI</button>
    </div>

    <section class="hud" aria-label="Pieces remaining">
      <div class="side side--p1" id="side-1"><span class="dot"></span><strong>Player 1</strong><b id="count-1">12</b></div>
      <div class="turn-pill" id="turn-pill">Player 1's turn</div>
      <div class="side side--p2" id="side-2"><b id="count-2">12</b><strong id="name-2">Player 2</strong><span class="dot"></span></div>
    </section>

    <div class="board-wrap" id="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Checkers board, eight by eight"></div>
    </div>

    <div class="actions">
      <p class="hint" id="hint">Tap a piece, then a highlighted square. Captures are forced.</p>
      <button class="btn btn--ghost" id="new-game" type="button">New game</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <div class="veil" id="veil" hidden>
    <div class="veil-card" role="dialog" aria-modal="true" aria-labelledby="veil-title">
      <img src="assets/icon.svg" alt="" width="64" height="64">
      <p class="eyebrow">Game complete</p>
      <h2 id="veil-title">Player 1 wins!</h2>
      <p id="veil-copy">All pieces captured.</p>
      <div class="veil-actions">
        <button class="btn btn--primary" id="rematch" type="button">Play again</button>
        <a class="btn btn--ghost" href="../../index.html">All games</a>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('../../sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
