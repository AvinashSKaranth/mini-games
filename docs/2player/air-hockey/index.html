<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <meta name="description" content="Two-player Air Hockey on one device. Drag your mallet, guard your goal, and score seven first.">
  <title>Air Hockey · 2 Player · Mini Games</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="40" height="40">
        <div>
          <h1>Air Hockey</h1>
          <p>2 players · first to 7</p>
        </div>
      </div>
      <button class="icon-btn" id="reset" type="button" aria-label="Start a new match">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section class="hud" aria-label="Score">
      <div class="score score--p1" id="card-1"><span></span><strong>Player 1</strong><b id="score-1">0</b></div>
      <div class="hud-target">First to 7</div>
      <div class="score score--p2" id="card-2"><b id="score-2">0</b><strong>Player 2</strong><span></span></div>
    </section>

    <div class="rink-wrap" id="rink-wrap">
      <canvas id="rink" width="600" height="360" role="application" aria-label="Air hockey rink. Player 1 defends the left goal and Player 2 defends the right."></canvas>
      <div class="serve" id="serve" hidden><span id="serve-text">GO</span></div>
    </div>

    <div class="actions">
      <p class="hint">Drag your mallet in your half. Touch both sides at once for local two-player.</p>
      <button class="btn btn--ghost" id="new-match" type="button">New match</button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <div class="veil" id="veil" hidden>
    <div class="veil-card" role="dialog" aria-modal="true" aria-labelledby="veil-title">
      <img src="assets/icon.svg" alt="" width="64" height="64">
      <p class="eyebrow">Match complete</p>
      <h2 id="veil-title">Player 1 wins!</h2>
      <p id="veil-copy">7 to 4.</p>
      <div class="veil-actions">
        <button class="btn btn--primary" id="rematch" type="button">Rematch</button>
        <a class="btn btn--ghost" href="../../index.html">All games</a>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('../../sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
