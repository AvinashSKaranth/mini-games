<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F0">
  <meta name="description" content="Play Chess on one device against a friend or the computer. Legal moves, checks, castling, and promotion.">
  <title>Chess · Mini Games</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="40" height="40">
        <div><h1>Chess</h1><p>2 players · or vs AI</p></div>
      </div>
      <button class="icon-btn" id="reset" type="button" aria-label="Start a new game">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="difficulty" role="group" aria-label="Opponent">
      <button type="button" data-mode="2p" class="is-active">2 Players</button>
      <button type="button" data-mode="ai">vs AI</button>
    </div>

    <div class="hud">
      <span class="turn-pill" id="turn-pill">White to move</span>
      <span class="check-pill" id="check-pill" hidden>Check</span>
      <button class="btn btn--ghost btn--small" id="undo" type="button">Undo</button>
    </div>

    <div class="board-wrap" id="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Chess board, eight by eight"></div>
    </div>

    <div class="actions">
      <p class="hint" id="hint">Tap a piece, then a highlighted square. Castling and en passant are supported.</p>
      <button class="btn btn--ghost" id="new-game" type="button">New game</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <div class="veil" id="veil" hidden>
    <div class="veil-card" role="dialog" aria-modal="true" aria-labelledby="veil-title">
      <img src="assets/icon.svg" alt="" width="64" height="64">
      <p class="eyebrow">Game complete</p>
      <h2 id="veil-title">White wins!</h2>
      <p id="veil-copy">Checkmate.</p>
      <div class="veil-actions">
        <button class="btn btn--primary" id="rematch" type="button">Play again</button>
        <a class="btn btn--ghost" href="../../index.html">All games</a>
      </div>
    </div>
  </div>

  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <g id="shapeP"><path d="M22.5 9c-2.2 0-4 1.8-4 4 0 1 .4 2 1 2.7-2.4 1.5-4 4.1-4 7.1 0 3.4 2.1 6.4 5.1 7.7h3.8c3-1.3 5.1-4.3 5.1-7.7 0-3-1.6-5.6-4-7.1.6-.7 1-1.7 1-2.7 0-2.2-1.8-4-4-4z"/><path d="M16 32h13l2 5H14z"/></g>
      <g id="shapeN"><path d="M22 7c-4 0-7 3-8 7l-3 4 4 2 2-4 2 3-4 8c-1 2-2 4-2 6h16c0-5-1-9-3-13-2-4-4-6-4-9z"/><path d="M20 12l-2 3 3 1z"/><path d="M13 33h19v4H13z"/></g>
      <g id="shapeB"><path d="M22.5 7c-2 0-3.5 1.5-3.5 3.5 0 .8.2 1.5.7 2.1-2.6 2.6-4.7 6.6-4.7 10.4 0 3.4 2.1 6.2 5.1 7.3l1.4.5h2l1.4-.5c3-1.1 5.1-3.9 5.1-7.3 0-3.8-2.1-7.8-4.7-10.4.5-.6.7-1.3.7-2.1 0-2-1.5-3.5-3.5-3.5z"/><path d="M17 32h11l2 5H15z"/><circle cx="22.5" cy="10.5" r="1.5"/></g>
      <g id="shapeR"><path d="M14 10h4v4h3v-4h3v4h3v-4h4v9l-3 3v10H17V22l-3-3z"/><path d="M15 33h15l2 4H13z"/></g>
      <g id="shapeQ"><path d="M9 15l4 4 3-7 3 7 3-7 3 7 4-4-3 17H12z"/><path d="M13 33h19l2 4H11z"/><circle cx="9" cy="14" r="2.2"/><circle cx="17" cy="10" r="2.2"/><circle cx="22.5" cy="9" r="2.2"/><circle cx="28" cy="10" r="2.2"/><circle cx="36" cy="14" r="2.2"/></g>
      <g id="shapeK"><path d="M22.5 6v5M20 8.5h5" fill="none"/><path d="M18 14c0 2 1 3.5 2.5 4.5L18 30h9l-2.5-11.5C26 17.5 27 16 27 14c0-2.5-2-4.5-4.5-4.5S18 11.5 18 14z"/><path d="M15 33h15l2 4H13z"/></g>
    </defs>
    <symbol id="wP" viewBox="0 0 45 45"><use href="#shapeP" fill="#fffdf7" stroke="#1e2433" stroke-width="2"/></symbol>
    <symbol id="wN" viewBox="0 0 45 45"><use href="#shapeN" fill="#fffdf7" stroke="#1e2433" stroke-width="2"/></symbol>
    <symbol id="wB" viewBox="0 0 45 45"><use href="#shapeB" fill="#fffdf7" stroke="#1e2433" stroke-width="2"/></symbol>
    <symbol id="wR" viewBox="0 0 45 45"><use href="#shapeR" fill="#fffdf7" stroke="#1e2433" stroke-width="2"/></symbol>
    <symbol id="wQ" viewBox="0 0 45 45"><use href="#shapeQ" fill="#fffdf7" stroke="#1e2433" stroke-width="2"/></symbol>
    <symbol id="wK" viewBox="0 0 45 45"><use href="#shapeK" fill="#fffdf7" stroke="#1e2433" stroke-width="2"/></symbol>
    <symbol id="bP" viewBox="0 0 45 45"><use href="#shapeP" fill="#263044" stroke="#f6e7d4" stroke-width="2"/></symbol>
    <symbol id="bN" viewBox="0 0 45 45"><use href="#shapeN" fill="#263044" stroke="#f6e7d4" stroke-width="2"/></symbol>
    <symbol id="bB" viewBox="0 0 45 45"><use href="#shapeB" fill="#263044" stroke="#f6e7d4" stroke-width="2"/></symbol>
    <symbol id="bR" viewBox="0 0 45 45"><use href="#shapeR" fill="#263044" stroke="#f6e7d4" stroke-width="2"/></symbol>
    <symbol id="bQ" viewBox="0 0 45 45"><use href="#shapeQ" fill="#263044" stroke="#f6e7d4" stroke-width="2"/></symbol>
    <symbol id="bK" viewBox="0 0 45 45"><use href="#shapeK" fill="#263044" stroke="#f6e7d4" stroke-width="2"/></symbol>
  </svg>

  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('../../sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
